# Outer Wilds theme for Kitty
# Palette: Timber Hearth campfire, Nomai ruins, Brittle Hollow ice,
# Dark Bramble, the Hourglass Twins, and the supernova.
#
# Install: save as ~/.config/kitty/outerwilds.conf, then add to kitty.conf:
#   include outerwilds.conf

# Core
background              #0d0e1a
foreground              #e8dcc8
cursor                  #e8823c
cursor_text_color       #0d0e1a
selection_background    #242847
selection_foreground    #e8dcc8

# Borders / tabs
active_border_color     #e8823c
inactive_border_color   #242847
bell_border_color       #e8563e

active_tab_foreground   #0d0e1a
active_tab_background   #e8823c
inactive_tab_foreground #a7a8bd
inactive_tab_background #15172a
tab_bar_background      #0d0e1a

# URL underline
url_color               #6ab0f3

# 16-color palette
# black
color0  #1c1f38
color8  #5c6178
# red (supernova / lava)
color1  #e8563e
color9  #ff6e52
# green (Giant's Deep)
color2  #5fb98c
color10 #79d4a6
# yellow / gold (Hourglass sand, Timber Hearth soil)
color3  #d9a441
color11 #f0bd5a
# blue (Brittle Hollow ice)
color4  #6ab0f3
color12 #8ec6ff
# magenta / purple (Nomai text, Dark Bramble)
color5  #a78bd9
color13 #c0a8ee
# cyan (Quantum Moon, probe/scout)
color6  #5ec9c9
color14 #7fe0e0
# white
color7  #e8dcc8
color15 #fdf6ea

# Misc
mark1_foreground #0d0e1a
mark1_background #e8823c
